<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>學習計畫管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>學習計畫管理</h1>

    <div class="plan-header">
        <h2>所有計畫</h2>
        <button type="button"
                onclick="window.location.href='addPlan.html'">
            新增計畫
        </button>
    </div>

    <table>
        <thead>
        <tr>
            <th>計畫名稱</th>
            <th>計畫起始日</th>
            <th>計畫中止日</th>
            <th>計畫是否已完成</th>
            <th>操作</th>
        </tr>
        </thead>

        <tbody id="plan-list">
        <!-- 由 app.js 動態載入計畫 -->
        </tbody>
    </table>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
